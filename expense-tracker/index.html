<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>記帳網站</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section class="top"><p>Portfolio Project 04</p><h1>個人記帳網站</h1><span>可新增收入/支出、分類紀錄、計算結餘，資料會存在瀏覽器 LocalStorage。</span></section><section class="summary"><div><span>收入</span><strong id="income">$0</strong></div><div><span>支出</span><strong id="expense">$0</strong></div><div><span>結餘</span><strong id="balance">$0</strong></div></section><section class="grid"><form id="form" class="card"><h2>新增紀錄</h2><label>類型<select id="type"><option value="income">收入</option><option value="expense">支出</option></select></label><label>分類<input id="category" placeholder="餐飲 / 交通 / 薪資"></label><label>金額<input id="amount" type="number" placeholder="1000"></label><label>備註<input id="note" placeholder="午餐、捷運、接案收入..."></label><button>新增</button></form><section class="card"><h2>紀錄列表</h2><ul id="records"></ul></section></section></main><script src="script.js"></script></body></html>
